# Atualiza o feed de notícias (data/noticias.json) e publica o site no GitHub Pages.
# - A cada push na main: publica o site imediatamente.
# - A cada 6 horas: busca notícias novas, commita na main e republica.
# O site é servido a partir da branch gh-pages.

name: Novidades e deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novidades-e-deploy
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar notícias
        run: node scripts/fetch-news.mjs

      - name: Commitar feed atualizado
        run: |
          git config user.name "tlou-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "Feed sem mudanças."
          else
            git commit -m "Atualiza feed de novidades"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publicar na branch gh-pages
        run: git push --force origin HEAD:gh-pages
